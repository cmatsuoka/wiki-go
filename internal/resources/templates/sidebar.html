{{define "sidebar"}}
<button class="hamburger" aria-label="Toggle menu">
    <span class="hamburger-icon"></span>
</button>
<div class="sidebar">
    <div class="sidebar-header">
        <a href="/" class="sidebar-title">
            {{$logoPath := hasLogo .Config.Wiki.RootDir}}
            {{if $logoPath}}
            <div class="logo-container">
                <img src="{{$logoPath}}" alt="" class="sidebar-logo">
            </div>
            {{end}}
            <div class="title-text">{{.Config.Wiki.Title}}</div>
        </a>
        <div class="search-container">
            <input type="text" class="search-box" placeholder='{{t "common.search"}}...' aria-label="{{t "common.search"}}">
        </div>
    </div>
    <div class="nav-items" data-always-open="{{.Navigation.AlwaysOpen}}">
        {{template "nav-items" .Navigation}}
    </div>
    <script>
        // Restore the sidebar tree to its final expanded/collapsed state
        // synchronously, before the browser paints, to avoid a flicker.
        (function() {
            var navItems = document.querySelector('.nav-items');
            if (!navItems) return;

            var alwaysOpen = navItems.getAttribute('data-always-open') === 'true';
            var state = {};
            try {
                state = JSON.parse(sessionStorage.getItem('wikiGo.sidebarNavState') || '{}');
            } catch (e) {
                state = {};
            }

            navItems.querySelectorAll('.nav-item.directory').forEach(function(item) {
                var link = item.querySelector(':scope > .nav-item-header > a');
                if (!link) return;

                var path = new URL(link.href, window.location.origin).pathname;
                var hasActiveChild = item.querySelector('.nav-item.active') !== null ||
                                     item.classList.contains('active');
                var isOpen;

                if (state.hasOwnProperty(path)) {
                    // Respect explicit user preference above all else.
                    isOpen = state[path];
                } else if (alwaysOpen) {
                    isOpen = true;
                } else {
                    // On the first visit to this path, expand the active branch
                    // so the current page is visible.
                    isOpen = hasActiveChild;
                }

                item.classList.toggle('open', isOpen);
                var arrow = item.querySelector('.nav-arrow');
                if (arrow) arrow.setAttribute('aria-expanded', String(isOpen));
            });
        })();
    </script>
    <div class="sidebar-footer">
        <div class="owner">{{.Config.Wiki.Owner}}</div>
        <div class="notice">{{processShortcodes .Config.Wiki.Notice}}</div>
        <div class="sidebar-footer-buttons">
            <button class="sidebar-footer-btn" aria-label="Sitemap" title="{{t "sitemap.title"}}" onclick="window.open('/sitemap/', '_blank')">
                <i class="fa fa-sitemap"></i>
            </button>
            <button class="sidebar-footer-btn" aria-label="Toggle theme">
                <i class="fa fa-sun-o light-icon"></i>
                <i class="fa fa-moon-o dark-icon" style="display: none;"></i>
            </button>
        </div>
    </div>
</div>
{{end}}
